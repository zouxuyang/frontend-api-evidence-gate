# 将以下步骤映射到 GitHub Actions、Gitee CI 或其他 CI 平台。
name: acceptance

steps:
  - name: install
    run: npm ci

  - name: typecheck
    run: npm run check

  - name: acceptance
    run: npm run acceptance -- acceptance-spec.yaml --output artifacts --reuse

# 将 typecheck 和 acceptance 设置为 Required checks。
# 将 artifacts/ 作为 CI artifact 保存，供后续 Agent 读取。
